name: CI/CD Pipeline

on:
  push:
    branches:
      - main  # Or any other branch you'd like to monitor for changes

jobs:
  build:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v2

    # Build Docker Image and Push to DockerHub
    - name: Log in to DockerHub
      uses: docker/login-action@v2
      with:
        username: ${{ secrets.DOCKER_USERNAME }}
        password: ${{ secrets.DOCKER_PASSWORD }}

    - name: Build Docker image
      run: |
        docker build -t dhanushsgowda/frontend:latest .
        docker build -t dhanushsgowda/backend:latest .

    - name: Push Docker images
      run: |
        docker push dhanushsgowda/frontend:latest
        docker push dhanushsgowda/backend:latest

    # Apply Kubernetes Deployment
    - name: Set up Kubernetes kubectl
      uses: azure/setup-kubectl@v1
      with:
        kubeconfig: ${{ secrets.KUBE_CONFIG }}  # You can save your kubeconfig in GitHub secrets

    - name: Deploy to Kubernetes
      run: |
        kubectl set image deployment/frontend frontend=dhanushsgowda/frontend:latest
        kubectl set image deployment/backend backend=dhanushsgowda/backend:latest
        kubectl apply -f k8s/backend-deployment.yaml
        kubectl apply -f k8s/frontend-deployment.yaml

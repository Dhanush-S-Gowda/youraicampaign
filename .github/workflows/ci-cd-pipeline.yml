name: CI/CD Pipeline

on:
  push:
    branches:
      - main  # Or any other branch you'd like to monitor for changes

jobs:
  build:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v2

    # Log in to DockerHub
    - name: Log in to DockerHub
      uses: docker/login-action@v2
      with:
        username: ${{ secrets.DOCKER_USERNAME }}
        password: ${{ secrets.DOCKER_PASSWORD }}

    # Build Docker Images for Frontend and Backend
    - name: Build Frontend Docker image
      run: |
        docker build -t dhanushsgowda/frontend:latest ./frontend  # Specify the frontend directory with Dockerfile

    - name: Build Backend Docker image
      run: |
        docker build -t dhanushsgowda/backend:latest ./backend  # Specify the backend directory with Dockerfile

    # Push Docker images to DockerHub
    - name: Push Docker images
      run: |
        docker push dhanushsgowda/frontend:latest
        docker push dhanushsgowda/backend:latest

    # Set up Kubernetes kubectl
    - name: Set up Kubernetes kubectl
      uses: azure/setup-kubectl@v1
      with:
        kubeconfig: ${{ secrets.KUBE_CONFIG }}  # Store your kubeconfig in GitHub secrets

    # Deploy to Kubernetes
    - name: Deploy to Kubernetes
      run: |
        # Update the frontend and backend deployments with the latest images
        kubectl set image deployment/frontend frontend=dhanushsgowda/frontend:latest
        kubectl set image deployment/backend backend=dhanushsgowda/backend:latest

        # Apply the Kubernetes deployment configurations (if not already applied)
        kubectl apply -f k8s/backend-deployment.yaml
        kubectl apply -f k8s/frontend-deployment.yaml
